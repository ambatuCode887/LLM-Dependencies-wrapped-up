[project]
name = "local-llm"
version = "0.1.0"
description = "Local LLM gateway: OpenAI-compatible, multi-model, with fallback and TOON support"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "httpx", "pyyaml"]

[project.optional-dependencies]
toon = ["python-toon"]
dev = ["pytest", "pytest-asyncio"]
benchmark = ["python-toon", "tiktoken"]

[project.scripts]
local-llm = "local_llm.gateway.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
